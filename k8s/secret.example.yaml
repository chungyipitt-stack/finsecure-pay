# ---------------------------------------------------------------------------
# EXAMPLE ONLY - do not put real values in Git.
# The real Secret is created by the Jenkins "Deploy" stage from the Jenkins
# credential "finsecure-api-key":
#
#   kubectl -n finsecure create secret generic finsecure-pay-secrets \
#     --from-literal=FINSECURE_API_KEY="$API_KEY" \
#     --dry-run=client -o yaml | kubectl apply -f -
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: finsecure-pay-secrets
  namespace: finsecure
type: Opaque
stringData:
  FINSECURE_API_KEY: "<injected-by-jenkins>"
