apiVersion: v1
kind: ConfigMap
metadata:
  name: finsecure-pay-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"      # auto-loaded by the Grafana sidecar
data:
  finsecure-pay.json: |-
    {
      "title": "FinSecure Pay - Service Overview",
      "uid": "finsecure-pay",
      "timezone": "browser",
      "refresh": "10s",
      "schemaVersion": 39,
      "time": { "from": "now-30m", "to": "now" },
      "tags": ["finsecure", "spring-boot"],
      "panels": [
        {
          "type": "stat", "title": "Available replicas", "id": 1,
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "kube_deployment_status_replicas_available{namespace=\"finsecure\",deployment=\"finsecure-pay\"}" }],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [
            { "color": "red", "value": null }, { "color": "orange", "value": 1 }, { "color": "green", "value": 2 } ] } }, "overrides": [] }
        },
        {
          "type": "stat", "title": "Rejection ratio (2m)", "id": 2,
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum(rate(finsecure_validations_total{namespace=\"finsecure\",result=\"rejected\"}[2m])) / sum(rate(finsecure_validations_total{namespace=\"finsecure\"}[2m]))" }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "orange", "value": 0.3 }, { "color": "red", "value": 0.5 } ] } }, "overrides": [] }
        },
        {
          "type": "stat", "title": "Requests / sec", "id": 3,
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"finsecure\"}[1m]))" }],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "type": "stat", "title": "p95 /validate latency", "id": 4,
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"finsecure\",uri=\"/validate\"}[5m])))" }],
          "fieldConfig": { "defaults": { "unit": "s", "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "red", "value": 0.5 } ] } }, "overrides": [] }
        },
        {
          "type": "stat", "title": "Pod restarts (1h)", "id": 5,
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"finsecure\"}[1h]))" }]
        },
        {
          "type": "stat", "title": "Firing alerts", "id": 6,
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "count(ALERTS{alertstate=\"firing\",team=\"finsecure\"}) or vector(0)" }],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] }
        },
        {
          "type": "timeseries", "title": "Validations per second (approved vs rejected)", "id": 7,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum by (result) (rate(finsecure_validations_total{namespace=\"finsecure\"}[1m]))", "legendFormat": "{{result}}" }],
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] }
        },
        {
          "type": "timeseries", "title": "Rule violations by code", "id": 8,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum by (code) (rate(finsecure_validation_violations_total{namespace=\"finsecure\"}[1m]))", "legendFormat": "{{code}}" }],
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] }
        },
        {
          "type": "timeseries", "title": "HTTP requests by status", "id": 9,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum by (uri, status) (rate(http_server_requests_seconds_count{namespace=\"finsecure\"}[1m]))", "legendFormat": "{{uri}} {{status}}" }],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "type": "timeseries", "title": "Latency p50 / p95 / p99 (/validate)", "id": 10,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"finsecure\",uri=\"/validate\"}[5m])))", "legendFormat": "p50" },
            { "refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"finsecure\",uri=\"/validate\"}[5m])))", "legendFormat": "p95" },
            { "refId": "C", "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"finsecure\",uri=\"/validate\"}[5m])))", "legendFormat": "p99" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "type": "timeseries", "title": "Pod CPU usage (cores)", "id": 11,
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"finsecure\",container=\"finsecure-pay\"}[2m]))", "legendFormat": "{{pod}}" }]
        },
        {
          "type": "timeseries", "title": "Pod memory working set", "id": 12,
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"finsecure\",container=\"finsecure-pay\"})", "legendFormat": "{{pod}}" }],
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] }
        },
        {
          "type": "timeseries", "title": "JVM heap used", "id": 13,
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum by (pod) (jvm_memory_used_bytes{namespace=\"finsecure\",area=\"heap\"})", "legendFormat": "{{pod}}" }],
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] }
        },
        {
          "type": "timeseries", "title": "Node CPU utilisation", "id": 14,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 29 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[2m]))", "legendFormat": "{{instance}}" }],
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] }
        },
        {
          "type": "timeseries", "title": "Node memory utilisation", "id": 15,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 29 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes", "legendFormat": "{{instance}}" }],
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] }
        }
      ]
    }
