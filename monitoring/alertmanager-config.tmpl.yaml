# Alertmanager configuration TEMPLATE.
# ${SMTP_USER}, ${SMTP_PASSWORD}, ${ALERT_EMAIL_TO} are substituted by install-monitoring.sh
# (envsubst) and the result is stored ONLY as a Kubernetes Secret - never committed with real values.
global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '${SMTP_USER}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

route:
  receiver: 'null'
  group_by: ['alertname', 'namespace']
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 1h
  routes:
    - receiver: finsecure-email
      matchers:
        - team = "finsecure"

receivers:
  - name: 'null'
  - name: finsecure-email
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }}) - FinSecure Pay'

inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: [alertname, namespace]
