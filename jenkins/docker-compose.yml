services:
  jenkins:
    build: .
    image: finsecure-jenkins:local
    container_name: finsecure-jenkins
    user: root                      # needed for host Docker socket on Docker Desktop (lab only)
    restart: unless-stopped
    ports:
      - "8088:8080"                 # 8080/8090/50000 are already used on this host
    env_file:
      - .env                        # git-ignored; copy from .env.example
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
