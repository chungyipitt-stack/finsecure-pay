# -----------------------------------------------------------------------------
# Single-node Elasticsearch + Kibana for centralised logging (EFK).
# Demo sizing: emptyDir storage and security disabled, reachable ONLY inside the
# cluster (ClusterIP) and accessed via `kubectl port-forward`.
# Production: use ECK / Amazon OpenSearch with TLS, auth and persistent volumes.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: logging
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels: { app: elasticsearch }
  template:
    metadata:
      labels: { app: elasticsearch }
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            - { name: node.store.allow_mmap, value: "false" }   # avoids vm.max_map_count host tuning
            - { name: ES_JAVA_OPTS, value: "-Xms1g -Xmx1g" }
          ports:
            - { name: http, containerPort: 9200 }
          resources:
            requests: { cpu: 250m, memory: 1536Mi }
            limits:   { memory: 2Gi }
          readinessProbe:
            httpGet:
              path: "/_cluster/health?local=true"
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: logging
spec:
  selector: { app: elasticsearch }
  ports:
    - { name: http, port: 9200, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels: { app: kibana }
  template:
    metadata:
      labels: { app: kibana }
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.17.0
          env:
            - { name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch.logging.svc:9200" }
          ports:
            - { name: http, containerPort: 5601 }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /api/status, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: logging
spec:
  selector: { app: kibana }
  ports:
    - { name: http, port: 5601, targetPort: http }
